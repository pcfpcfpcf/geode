<!DOCTYPE html>
<!-- A minimal ChatGPT-like chat for a geode serve instance. Open this file in
     a browser, point it at the API (default http://127.0.0.1:8080/v1), pick a
     model, and talk. No dependencies, no build step. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>geode chat</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font: 15px/1.5 system-ui, sans-serif; background: #111; color: #eee;
  }
  header {
    display: flex; gap: 8px; align-items: center; padding: 10px 16px;
    border-bottom: 1px solid #2a2a2a; background: #161616;
  }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  header input, header select, header button {
    background: #222; color: #eee; border: 1px solid #333;
    border-radius: 6px; padding: 6px 10px; font: inherit;
  }
  header input { flex: 1; max-width: 320px; }
  header button { cursor: pointer; }
  header button:hover { background: #2c2c2c; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; }
  .msg {
    max-width: 70%; margin: 0 0 12px; padding: 10px 14px;
    border-radius: 12px; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user { margin-left: auto; background: #1d4ed8; }
  .msg.assistant { background: #262626; }
  .msg.error { background: #3b0d0d; color: #ffb4b4; }
  footer {
    display: flex; gap: 8px; padding: 12px 16px;
    border-top: 1px solid #2a2a2a; background: #161616;
  }
#input {
    flex: 1; resize: none; background: #222; color: #eee;
    border: 1px solid #333; border-radius: 8px; padding: 10px; font: inherit;
  }
  #stats {
    align-self: center; margin-right: auto; color: #888;
    font-size: 12px; white-space: nowrap;
  }
  #send {
    background: #1d4ed8; color: #fff; border: 0; border-radius: 8px;
    padding: 0 20px; font: inherit; cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>geode chat</h1>
  <input id="api" value="http://127.0.0.1:8080/v1" spellcheck="false">
  <select id="model"></select>
  <button id="refresh" title="reload models">models</button>
  <button id="clear">clear</button>
</header>
<main id="messages"></main>
<footer>
  <span id="stats"></span>
  <textarea id="input" rows="1" placeholder="Message the model..."></textarea>
  <button id="send">send</button>
</footer>
<script>
"use strict";

const apiInput = document.getElementById("api");
const modelSelect = document.getElementById("model");
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statsEl = document.getElementById("stats");

function api() { return apiInput.value.replace(/\/+$/, ""); }

function addMessage(role, text) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.textContent = text;
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return el;
}

async function loadModels() {
  const res = await fetch(api() + "/models");
  if (!res.ok) throw new Error("GET /models -> " + res.status);
  const data = await res.json();
  modelSelect.innerHTML = "";
  for (const m of data.data) {
    const opt = document.createElement("option");
    opt.value = opt.textContent = m.id;
    modelSelect.appendChild(opt);
  }
}

/* Streams one reply, calling onDelta with each piece of text and onStats
   with the measured rates from the closing chunk. */
async function streamReply(messages, onDelta, onStats) {
  const res = await fetch(api() + "/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: modelSelect.value, messages, stream: true }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error((err.error && err.error.message) || "HTTP " + res.status);
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let end;
    while ((end = buf.indexOf("\n\n")) >= 0) {
      const event = buf.slice(0, end);
      buf = buf.slice(end + 2);
for (const line of event.split("\n")) {
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") return;
        const chunk = JSON.parse(data);
        if (chunk.timings) onStats(chunk.timings);
        const delta = chunk.choices[0].delta.content;
        if (delta) onDelta(delta);
      }
    }
  }
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || sendBtn.disabled) return;
  inputEl.value = "";
  addMessage("user", text);

  const messages = [];
  for (const el of messagesEl.children) {
    const role = el.classList.contains("user") ? "user"
               : el.classList.contains("assistant") ? "assistant" : null;
    if (role && el.textContent) messages.push({ role, content: el.textContent });
  }

  const reply = addMessage("assistant", "");
  sendBtn.disabled = true;
  try {
    await streamReply(messages, (delta) => {
      reply.textContent += delta;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }, (t) => {
      statsEl.textContent = "prefill " + t.prefill_tok_s.toFixed(1) +
        " tok/s · decode " + t.decode_tok_s.toFixed(1) + " tok/s";
    });
  } catch (err) {
    reply.classList.add("error");
    reply.textContent = "error: " + err.message;
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.onclick = send;
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById("clear").onclick = () => { messagesEl.innerHTML = ""; };
document.getElementById("refresh").onclick = async () => {
  try { await loadModels(); } catch (err) { addMessage("error", "error: " + err.message); }
};

loadModels().catch((err) => addMessage("error", "error: " + err.message));
</script>
</body>
</html>
